sources:
  ats:
    greenhouse:
      enabled: true
      boards:
        - stripe
        - databricks
        - anthropic
        - scaleai
        - mongodb
        - figma
        - airtable
    lever:
      enabled: true
      # Verified: api.lever.co/v0/postings/<slug> returned HTTP 200 with active
      # postings on 2026-09-10. India-based companies kept first.
      companies:
        - meesho
        - cred
        - zeta
        - freshworks
        - palantir
    ashby:
      enabled: true
      companies:
        - openai
        - cursor
        - cohere
        - perplexity
        - snowflake
        - zapier
    workday:
      # Free, official Workday CXS JSON API. host/tenant/site come from the
      # careers URL: https://{tenant}.wdN.myworkdayjobs.com/en-US/{site}
      enabled: true
      per_company_limit: 20
      companies:
        - { name: NVIDIA, host: nvidia.wd5.myworkdayjobs.com, tenant: nvidia, site: NVIDIAExternalCareerSite, search_text: "engineer india" }
        - { name: Citi, host: citi.wd5.myworkdayjobs.com, tenant: citi, site: "2", search_text: "machine learning india" }
        # add more: Salesforce, Adobe, SAP, Wipro, Cognizant, Accenture ...
    smartrecruiters:
      # Free, official postings API. Identifier = careers.smartrecruiters.com/{id}
      enabled: true
      fetch_details: true
      companies: []
        # e.g. - Bosch
        #      - Square
  portals:
    linkedin:
      enabled: true
    indeed:
      enabled: true
      country: india
    naukri:
      enabled: true
    foundit:
      enabled: true
    hirist:
      enabled: true
    cutshort:
      enabled: true
    instahyre:
      enabled: true
    wellfound:
      enabled: true
    shine:
      enabled: false
  # Gmail job-alert-email parsers (see gmail/watcher.py + sources/job_alert_emails.py
  # + sources/naukri.py). Free: you subscribe to alerts on each platform, the
  # platform emails you, the Gmail watcher parses the mail it already reads.
  # No scraping, no login automation against any of these sites.
  email_alerts:
    linkedin:
      enabled: true
    indeed:
      enabled: true
    instahyre:
      enabled: true
    naukri:
      enabled: true
    cutshort:
      enabled: true
    google_alerts:
      # Google Alerts on queries like `site:boards.greenhouse.io "AI Engineer" India`.
      # Only links that unwrap to a recognized ATS posting URL become jobs; the
      # rest of the alert (news/blog links) is discarded. See unwrap_google_redirect
      # in sources/job_alert_emails.py.
      enabled: true

  # Free, keyless public JSON job-board APIs. No .env needed.
  free_apis:
    remoteok:
      enabled: true
      min_keyword_hits: 1
    remotive:
      enabled: true
      min_keyword_hits: 1
      queries:
        - "machine learning"
        - "AI engineer"
        - "data engineer"
    arbeitnow:
      enabled: true
      min_keyword_hits: 1

  hackernews:
    # "Ask HN: Who is hiring?" monthly thread via the free Algolia API. No key.
    # Remote / startup heavy. Comments must hit >= min_keyword_hits of these terms.
    enabled: true
    min_keyword_hits: 3
    max_comments: 400

  adzuna:
    # Official Adzuna API, free tier (~250 calls/month). Needs ADZUNA_APP_ID +
    # ADZUNA_APP_KEY in .env (https://developer.adzuna.com). Skipped if unset.
    enabled: true
    country: in
    max_days_old: 7
    results_per_page: 50
    queries:
      - "AI engineer"
      - "machine learning engineer"
      - "data engineer"
      - "LLM engineer"

  career_ops:
    # Option B: pinned Apify actors called over the REST API and fed into the
    # same pipeline as the ATS sources. Needs APIFY_TOKEN in the environment.
    #
    # PAID and OFF BY DEFAULT. Job discovery is fully functional with this
    # disabled (Gmail alert emails + direct ATS feeds + free job APIs cover
    # discovery at $0/month) - only turn this on if you deliberately want the
    # extra Apify-scraped coverage and are OK with the small per-run spend.
    # Free Apify plan = ~$5/month credit. The Naukri actor charges ~$0.26 per run
    # (50 jobs). min_interval_hours keeps it to one run per interval no matter how
    # often `live` scans; monthly_cost_cap_usd is the backstop. Even with
    # enabled: true, nothing runs unless APIFY_TOKEN is also set.
    enabled: false
    monthly_cost_cap_usd: 4.0
    timeout_seconds: 300
    notes: "Actors pinned by id. min_interval_hours + monthly_cost_cap_usd bound the spend."
    actors:
      - id: muhammetakkurtt~naukri-job-scraper
        adapter: naukri_muhammetakkurtt
        source: naukri
        enabled: true
        min_interval_hours: 48        # at most one Naukri run every 2 days
        max_charge_usd: 1.0           # -> ?maxTotalChargeUsd (actor minimum is $0.50)
        est_charge_per_run_usd: 0.35  # observed ~$0.26 for maxJobs=50; headroom
        input:
          maxJobs: 50                 # actor minimum is 50
          freshness: "15"             # Naukri "last 15 days"
          sortBy: date
        searches:
          - { keyword: "AI Engineer" }
          # widen once the data looks right (each keyword = another ~$0.3 run):
          # - { keyword: "Machine Learning Engineer" }
          # - { keyword: "Data Engineer" }
      # ---- broken, kept for reference: fervent_bus~naukri-job-scraper-mcp
      #      runs OK but its Naukri parser returns 0 jobs (site changed).
      #
      # Add a pinned LinkedIn actor here once reviewed, e.g.:
      # - id: bebity~linkedin-jobs-scraper
      #   adapter: generic
      #   source: linkedin
      #   enabled: false
      #   min_interval_hours: 24
      #   max_charge_usd: 1.0
      #   searches:
      #     - { title: "AI Engineer", location: "India", rows: 25 }
  search_platforms:
    enabled: false
    mode: "connector_or_manual_export"
    notes:
      - "These are target platforms for Career Ops, Apify, browser automation, or manual CSV/export import."
      - "The current Python scanner does not scrape these platforms directly."
      - "Keep LinkedIn actions manual unless a compliant connector is explicitly approved."
    target_roles:
      - "AI Engineer"
      - "AI/ML Engineer"
      - "Machine Learning Engineer"
      - "Data Engineer"
      - "MLOps Engineer"
      - "LLM Engineer"
      - "RAG Engineer"
      - "Computer Vision Engineer"
      - "Data Scientist"
      - "Analytics Engineer"
    locations:
      - "India"
      - "Remote India"
      - "Pune"
      - "Bengaluru"
      - "Hyderabad"
      - "Mumbai"
      - "Delhi NCR"
      - "Gurgaon"
      - "Noida"
      - "Chennai"
    platforms:
      - name: "LinkedIn Jobs"
        priority: "p0"
        url: "https://www.linkedin.com/jobs/"
        connector_needed: true
        purpose: "Recruiter reach, referrals, direct company posts, and professional networking."
      - name: "Naukri"
        priority: "p0"
        url: "https://www.naukri.com/"
        connector_needed: true
        purpose: "High-volume Indian recruiter postings and traditional IT hiring."
      - name: "Indeed India"
        priority: "p0"
        url: "https://in.indeed.com/"
        connector_needed: true
        purpose: "Broad Indian job discovery across company and recruiter listings."
      - name: "Glassdoor India"
        priority: "p1"
        url: "https://www.glassdoor.co.in/"
        connector_needed: true
        purpose: "Company research, salary context, and additional job listings."
      - name: "Foundit"
        priority: "p1"
        url: "https://www.foundit.in/"
        connector_needed: true
        purpose: "IT, tech, and mid-market recruiter postings in India."
      - name: "Instahyre"
        priority: "p1"
        url: "https://www.instahyre.com/"
        connector_needed: true
        purpose: "Curated technology and product roles from Indian companies and startups."
      - name: "Cutshort"
        priority: "p1"
        url: "https://cutshort.io/"
        connector_needed: true
        purpose: "Startup, product, AI, and engineering roles in India."
      - name: "Wellfound"
        priority: "p1"
        url: "https://wellfound.com/jobs"
        connector_needed: true
        purpose: "Startup and remote-friendly AI/data engineering jobs."
      - name: "Hirist"
        priority: "p1"
        url: "https://www.hirist.tech/"
        connector_needed: true
        purpose: "Developer, data, cloud, and IT-specialist roles."
      - name: "IIMJobs"
        priority: "p2"
        url: "https://www.iimjobs.com/"
        connector_needed: true
        purpose: "Analytics, product analytics, strategy, and specialist data roles."
      - name: "Shine"
        priority: "p2"
        url: "https://www.shine.com/"
        connector_needed: true
        purpose: "Additional Indian recruiter volume."
      - name: "TimesJobs"
        priority: "p2"
        url: "https://www.timesjobs.com/"
        connector_needed: true
        purpose: "Additional IT and recruiter postings in India."
      - name: "Internshala"
        priority: "p2"
        url: "https://internshala.com/jobs/"
        connector_needed: true
        purpose: "Entry-level and early-career roles; useful selectively for 1-3 year openings."
      - name: "Apna"
        priority: "p2"
        url: "https://apna.co/jobs"
        connector_needed: true
        purpose: "Supplemental India job-board coverage."
      - name: "National Career Service"
        priority: "p2"
        url: "https://www.ncs.gov.in/"
        connector_needed: true
        purpose: "Government-backed job discovery for India."
      - name: "Freshersworld"
        priority: "p3"
        url: "https://www.freshersworld.com/"
        connector_needed: true
        purpose: "Early-career fallback; use only when 1-3 year filters are available."
  live_check:
    enabled: false
    timeout_seconds: 8
