name: Scan jobs (dispatch smoke only)

# Scheduled stateful scans run on your always-on machine via Windows Task
# Scheduler (`python run_agent.py once`) - the SQLite state cannot persist on an
# ephemeral GitHub runner. This workflow is a manual, stateless smoke check.

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Dry-run scan (no sends, no state commit)
        env:
          CLAUDE_MODE: mock
        run: python run_agent.py scan --dry-run --limit 10
