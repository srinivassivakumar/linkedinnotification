name: Career Agent - Callbacks

# Frequent, lightweight: only drains pending Telegram button presses so approvals
# feel responsive between the twice-daily full ticks (agent.yml). No ATS scan, no
# Gmail. GitHub may delay scheduled runs ~5-15 min under load - that's the
# approval latency. Public repo => Actions minutes are free.
#
# Only ONE process may poll a Telegram bot's getUpdates. Do not also run
# `run_agent.py telegram` / `workers` locally while this is active.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: career-agent-state   # shared with the tick: no racing git push
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Drain Telegram approvals
        env:
          CLAUDE_MODE: mock
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPROVAL_SECRET: ${{ secrets.APPROVAL_SECRET }}
        run: python run_agent.py callbacks

      - name: Commit state if a button changed it
        run: |
          git config user.name "career-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f state/career_agent.db
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "state: telegram callback [skip ci]"
          git pull --rebase --autostash || true
          git push
